apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: geonews

spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: ashish00234/geonews-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: geonews
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-0b8fd660d1a2e05c2,subnet-02d6e2aa1fff804a6,subnet-0e67a36d43cb483eb

spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 3000