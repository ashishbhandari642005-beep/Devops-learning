apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: campusops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ashish00234/campusops-backend:v1
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: campusops-secret
                  key: MONGO_URI