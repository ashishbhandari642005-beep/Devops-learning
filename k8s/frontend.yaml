apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: campusops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ashish00234/campusops-frontend:v1
          ports:
            - containerPort: 80