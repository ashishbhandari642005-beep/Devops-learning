name: GeoNews CI/CD
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - Geonews-project

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    
    - name: Build Backend Image
      run: docker build -t ashish00234/geonews-backend:latest ./geonews-backend

    - name: Push Backend Image
      run: docker push ashish00234/geonews-backend:latest

    
    - name: Build Frontend Image
      run: docker build -t ashish00234/geonews-frontend:latest ./geonews-frontend

    - name: Push Frontend Image
      run: docker push ashish00234/geonews-frontend:latest

    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-north-1

    
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --region eu-north-1 --name geonews-cluster

    
    - name: Restart Backend
      run: kubectl rollout restart deployment backend -n geonews

    - name: Restart Frontend
      run: kubectl rollout restart deployment frontend -n geonews
