name: CampusOps CI/CD

on:
  push:
    branches:
      - CampusOps-project

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t ashish00234/campusops-backend:v22 ./Backend
          docker push ashish00234/campusops-backend:v22

      - name: Build Frontend Image
        run: |
          docker build -t ashish00234/campusops-frontend:v22 ./frontend
          docker push ashish00234/campusops-frontend:v22

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region eu-north-1 --name geonews-cluster
        
      - name: Check Nodes
        run: kubectl get nodes
        
      - name: Restart Backend
        run: kubectl rollout restart deployment/backend -n campusops
        
      - name: Restart Frontend
        run: kubectl rollout restart deployment/frontend -n campusops
        
      - name: Backend Status
        run: kubectl rollout status deployment/backend -n campusops

      - name: Frontend Status
        run: kubectl rollout status deployment/frontend -n campusops

