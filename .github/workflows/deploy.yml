name: CampusOps CI/CD

on:
  push:
    branches:
      - CampusOps-project

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t ashish00234/campusops-backend:v21 ./Backend
          docker push ashish00234/campusops-backend:v21

      - name: Build Frontend Image
        run: |
          docker build -t ashish00234/campusops-frontend:v21 ./frontend
          docker push ashish00234/campusops-frontend:v21

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region eu-north-1 --name geonews
        
      - name: Check Nodes
        run: kubectl get nodes
      - name: Restart Backend
        run: kubectl rollout restart deployment/backend -n geonews
      - name: Restart Frontend
        run: kubectl rollout restart deployment/frontend -n geonews
      - name: Backend Status
        run: kubectl rollout status deployment/backend -n geonews

      - name: Frontend Status
        run: kubectl rollout status deployment/frontend -n geonews

