name: CampusOps CI/CD

on:
  push:
    branches:
      - CampusOps-project

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t ashish00234/campusops-backend:v21 ./Backend
          docker push ashish00234/campusops-backend:v21

      - name: Build Frontend Image
        run: |
          docker build -t ashish00234/campusops-frontend:v21 ./frontend
          docker push ashish00234/campusops-frontend:v21

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" > $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/backend backend=ashish00234/campusops-backend:v21
          kubectl set image deployment/frontend frontend=ashish00234/campusops-frontend:v21
          kubectl rollout status deployment/backend
          kubectl rollout status deployment/frontend